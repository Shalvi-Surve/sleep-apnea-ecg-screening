[project]
name = "apnea-ecg-pipeline"
version = "0.1.0"
description = "Preprocessing + model training pipeline for the PhysioNet Apnea-ECG dataset"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "wfdb>=4.1",
    "neurokit2>=0.2",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=1.5",
    "numpy>=1.24",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
xgboost = ["xgboost>=1.7"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# BLE001 (blind `except Exception`) is intentionally allowed here: a single
# record's annotation-parsing failure is treated as recoverable (log + skip
# / fall back) rather than aborting the whole batch preprocessing run.
ignore = ["BLE001"]
